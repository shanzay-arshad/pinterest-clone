
services:

  db:
    image: postgres:16-alpine
    container_name: pinterest_db_container
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is missing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is missing}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pinterest_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: db

    ports:
      - "8000:8000"

    volumes:
      - pin_uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pinterest_frontend
    restart: unless-stopped

    ports:
      - "5500:80"

    depends_on:
      - backend

volumes:
  postgres_data:
  pin_uploads:
