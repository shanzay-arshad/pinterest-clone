
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pinspiration | Explore</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold" href="#">
                <span class="brand-icon">P</span>
                Pinspiration
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav me-3">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="#">Explore</a>
                    </li>
                </ul>

                <!-- Search Bar -->
                <form class="search-form flex-grow-1" id="searchForm">
                    <input
                        type="search"
                        id="searchInput"
                        class="form-control search-input"
                        placeholder="Search for ideas..."
                    >
                </form>

                <button class="btn btn-dark ms-lg-3 mt-3 mt-lg-0" id="uploadBtn">
                    + Upload
                </button>

            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid px-4 py-4">

        <section class="text-center mb-4">
            <h1 class="fw-bold">Find your next idea</h1>
            <p class="text-muted">
                Discover inspiration for your next project, style, or adventure.
            </p>
        </section>

       
        <!-- Image Feed -->
<section class="pin-grid" id="pinGrid">

    <!-- Pins will be loaded dynamically from FastAPI -->

        </section>

        <p id="loadingMessage" class="text-center text-muted mt-4">
            Loading ideas...
        </p>

        <p id="noResults" class="text-center text-muted mt-4 d-none">
            No matching ideas found.
        </p>
        

        <p id="noResults" class="text-center text-muted mt-4 d-none">
            No matching ideas found.
        </p>

    </main>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Our custom JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
